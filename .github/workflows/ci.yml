name: CI Quality Gates

on:
  push:
    branches: [ main, develop, fix/*, feat/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Release & Link Integrity Gate
  release-verification:
    name: Stage 1 - Release & Link Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Release & Link Integrity Verification
        run: python3 scripts/verify_release.py --ci

  # Stage 2A: Backend Build, Tests & Coverage
  test-backend:
    name: Stage 2A - Backend Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore curatarr.slnx

      - name: Build solution
        run: dotnet build curatarr.slnx --no-restore --configuration Release

      - name: Run unit & integration tests with coverage
        run: dotnet test curatarr.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/**/coverage.cobertura.xml

  # Stage 2B: Frontend Quality, Lint & Tests
  lint-frontend:
    name: Stage 2B - Frontend Quality & Tests (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Curatarr.Web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/Curatarr.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend bundle
        run: npm run build

      - name: Run Vitest unit tests
        run: npm test

  # Stage 3: Fullstack Smoke Gate
  smoke:
    name: Stage 3 - Fullstack Integration Smoke Gate
    runs-on: ubuntu-latest
    needs: [release-verification, test-backend, lint-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build backend
        run: dotnet build src/Curatarr.Api/Curatarr.Api.csproj --configuration Release

      - name: Start server & probe health
        run: |
          dotnet run --project src/Curatarr.Api/Curatarr.Api.csproj --configuration Release --no-build --urls "http://localhost:8080" &
          APP_PID=$!
          echo "Server started with PID $APP_PID"

          for i in {1..20}; do
            if curl -s http://localhost:8080/health > /dev/null; then
              echo "Health check passed!"
              kill $APP_PID
              exit 0
            fi
            sleep 1
          done
          echo "Health check timed out!"
          kill $APP_PID
          exit 1

  # Stage 4: Container Build & GHCR Publish
  docker-publish:
    name: Stage 4 - Build & Publish Container (GHCR)
    runs-on: ubuntu-latest
    needs: [smoke]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
