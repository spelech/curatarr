name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-frontend:
    name: Lint & Typecheck Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Curatarr.Web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/Curatarr.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  test-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore curatarr.slnx
      - name: Build solution
        run: dotnet build curatarr.slnx --no-restore --configuration Release
      - name: Run unit & integration tests
        run: dotnet test curatarr.slnx --no-build --configuration Release --verbosity normal

  docker-verify:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: curatarr:ci-test
